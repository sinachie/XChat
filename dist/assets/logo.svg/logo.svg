<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="blue-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1118" />
      <stop offset="100%" stop-color="#05080C" />
    </linearGradient>

    <linearGradient id="cobalt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0047AB" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <filter id="blue-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0066FF" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="600" rx="24" fill="url(#blue-bg-grad)" />

  <g transform="translate(400, 230)">
    <path d="M -130 -120 L -80 -120 L 130 120 L 80 120 Z" fill="url(#cobalt-grad)" />
    <path d="M 130 -120 L 80 -120 L -130 120 L -80 120 Z" fill="url(#cobalt-grad)" />

    <circle cx="0" cy="0" r="48" fill="#0A1118" stroke="url(#cobalt-grad)" stroke-width="6" filter="url(#blue-glow)" />

    <path d="M -18 -12 H 18 A 10 10 0 0 1 28 -2 V 10 A 10 10 0 0 1 18 20 H 2 L -8 28 V 20 H -18 A 10 10 0 0 1 -28 10 V -2 A 10 10 0 0 1 -18 -12 Z" fill="url(#cobalt-grad)" />

    <circle cx="-10" cy="4" r="3" fill="#FFFFFF" />
    <circle cx="0" cy="4" r="3" fill="#FFFFFF" />
    <circle cx="10" cy="4" r="3" fill="#FFFFFF" />
  </g>

  <text x="400" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="3" text-anchor="middle">XCHAT</text>
  <text x="400" y="515" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#00D2FF" letter-spacing="6" text-anchor="middle">CONNECT BEYOND BOUNDARIES</text>
</svg>